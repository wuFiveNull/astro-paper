services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-384m}
    command:
      - --innodb-buffer-pool-size=96M
      - --max-connections=64
      - --performance-schema=OFF
      - --table-open-cache=256
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-astro_paper}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in the private server .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private server .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the private server .env file}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  api:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-512m}
    user: "10001:10001"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - java
      - -Xms64m
      - -Xmx192m
      - -XX:MaxMetaspaceSize=160m
      - -XX:MaxDirectMemorySize=32m
      - -XX:ReservedCodeCacheSize=32m
      - -jar
      - /app/astro-paper-api.jar
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-astro_paper}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the private server .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private server .env file}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      APP_UPLOAD_DIR: /data/uploads
      APP_UPLOAD_MAX_FILE_SIZE: ${APP_UPLOAD_MAX_FILE_SIZE:-10MB}
      APP_UPLOAD_MAX_REQUEST_SIZE: ${APP_UPLOAD_MAX_REQUEST_SIZE:-10MB}
      APP_UPLOAD_MAX_FILE_SIZE_BYTES: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:-10485760}
    volumes:
      - ./astro-paper-api.jar:/app/astro-paper-api.jar:ro
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18083}:8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a prebuilt Astro SSR image}
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    user: "10001:10001"
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8081
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-18084}:4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4321/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-astro_paper_mysql_data}
  uploads_data:
    name: ${UPLOADS_VOLUME_NAME:-astro_paper_uploads_data}
