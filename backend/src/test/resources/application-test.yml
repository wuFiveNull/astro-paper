spring:
  datasource:
    url: jdbc:h2:mem:astro_paper_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

server:
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
